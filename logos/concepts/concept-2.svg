<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-m-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="grad-m-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="bg-grad-c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <filter id="shadow-c2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0284C7" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect id="bg" width="512" height="512" rx="128" fill="url(#bg-grad-c2)" stroke="#E0F2FE" stroke-width="4"/>

  <!-- Icon: MeDiTech 'M' Neural Helix -->
  <g id="icon" filter="url(#shadow-c2)">
    <!-- Left Arch & Helix Strand -->
    <path fill="none" stroke="url(#grad-m-left)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" d="
      M 112 370 L 112 210 C 112 135 220 135 236 240 L 256 360
    "/>

    <!-- Right Arch & Helix Strand Interlocked -->
    <path fill="none" stroke="url(#grad-m-right)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" d="
      M 256 360 L 276 240 C 292 135 400 135 400 210 L 400 370
    "/>

    <!-- Upper Neural Telemetry Nodes -->
    <circle cx="168" cy="148" r="16" fill="#38BDF8" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="344" cy="148" r="16" fill="#00A3E0" stroke="#FFFFFF" stroke-width="5"/>

    <!-- Central Precision Nexus -->
    <circle cx="256" cy="300" r="14" fill="#0284C7" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>
