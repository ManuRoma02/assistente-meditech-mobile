<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="loop-grad-c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow-c4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect id="bg" width="512" height="512" rx="128" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Icon: Vital Loop & ECG Waveform -->
  <g id="icon" filter="url(#shadow-c4)">
    <!-- Continuous Biometric Band -->
    <path fill="none" stroke="url(#loop-grad-c4)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="
      M 160 310 
      C 100 270 95 180 155 140 
      C 215 100 240 180 256 220 
      C 272 260 300 340 360 300 
      C 420 260 410 170 350 140
    "/>

    <!-- Sharp Clinical ECG Peak Inset -->
    <path fill="none" stroke="#0284C7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="
      M 190 256 L 225 256 L 245 180 L 265 310 L 285 230 L 305 256 L 330 256
    "/>

    <!-- Signal Monitoring Node -->
    <circle cx="245" cy="180" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="5"/>
  </g>
</svg>
