<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cm-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="cm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1024" height="512" fill="#FFFFFF"/>

  <!-- Left Icon Lockup (viewBox scaled to 320x320 centered in 100..420) -->
  <g id="icon" transform="translate(70, 96)" filter="url(#cm-shadow)">
    <!-- Rounded Container -->
    <rect width="320" height="320" rx="80" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="3"/>
    
    <!-- Central Swiss Cross -->
    <path fill="url(#cm-blue-grad)" d="
      M 128 50 C 128 42 134 36 142 36 L 178 36 C 186 36 192 42 192 50 L 192 112 L 254 112 C 262 112 268 118 268 126 L 268 162 C 268 170 262 176 254 176 L 192 176 L 192 238 C 192 246 186 252 178 252 L 142 252 C 134 252 128 246 128 238 L 128 176 L 66 176 C 58 176 52 170 52 162 L 52 126 C 52 118 58 112 66 112 L 128 112 Z
    "/>

    <!-- Vital Pulse Wave Overlay -->
    <path fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="
      M 72 144 L 120 144 L 140 108 L 160 178 L 180 124 L 200 144 L 248 144
    "/>

    <!-- Telemetry Pulse Node -->
    <circle cx="160" cy="144" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Right Typography Lockup -->
  <g id="wordmark" transform="translate(440, 160)">
    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="#0F172A" letter-spacing="-1.5">
      MeDi<tspan fill="#0284C7">Tech</tspan>
    </text>

    <!-- Subtitle: Institute & SUPSI -->
    <text x="4" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#64748B" letter-spacing="3.5">
      ISTITUTO CURE SANITARIE PERSONALIZZATE • SUPSI
    </text>

    <!-- Tagline Badge -->
    <g transform="translate(4, 140)">
      <rect width="210" height="38" rx="8" fill="url(#badge-bg)"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0369A1" letter-spacing="1">
        ASSISTENTE CLINICO
      </text>
    </g>
  </g>
</svg>
